name: Sync posts from source repos

on:
  schedule:
    - cron: "23 3 * * *" # daily 03:23 UTC = 11:23 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Import new posts from source repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_source_posts.py

      - name: Commit imported posts
        run: |
          if [ -n "$(git status --porcelain _posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _posts
            git commit -m "sync: import new posts from source repos"
            git push
          else
            echo "no new posts"
          fi
